# Keys from this file are merged into ~/.codex/config.toml by install.sh.
# Keep each managed value on one line so scripts/update-codex-config.py can
# preserve the rest of the user's machine-local configuration verbatim.

project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["CLAUDE.md", "CLAUDE.local.md"]

[tui]
status_line = ["current-dir", "git-branch", "context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]

[mcp_servers.slack]
disabled_tools = ["slack_create_conversation", "slack_create_canvas", "slack_update_canvas", "slack_schedule_message", "slack_send_message"]
